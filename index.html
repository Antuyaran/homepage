<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>The Unquiet Page</title>

  <style>
    /* ==============================
       Basic Reset
       ============================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;

      font-family: "American Typewriter Medium", "American Typewriter", "Courier New", monospace;
      background: #ffffff;
    }

    /* ==============================
       Random Background
       01.jpg - 18.jpg 会撑满整个网页背景
       每 4 秒随机抽取一张
       ============================== */

    body {
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      transition: background-image 0.2s ease;
    }

    /* ==============================
       Main Grid
       版心距离视口边缘各 20px
       版心平均分为 6 行 12 列
       网格不可见，只作为排版辅助
       ============================== */

    .page-grid {
      position: fixed;
      inset: 20px;

      width: calc(100vw - 40px);
      height: calc(100vh - 40px);

      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(6, 1fr);
    }

    /* ==============================
       Debug Grid
       如果之后需要检查网格位置，可以临时打开这一段
       正式网页保持注释即可
       ============================== */

    /*
    .page-grid {
      background-image:
        linear-gradient(to right, rgba(0, 0, 0, 0.18) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.18) 1px, transparent 1px);
      background-size:
        calc(100% / 12) 100%,
        100% calc(100% / 6);
    }
    */

    /* ==============================
       First Row Navigation
       第一行固定文字部分
       所有字体改为 American Typewriter Medium
       ============================== */

    .nav-item,
    .background-info {
      align-self: start;
      justify-self: start;

      font-family: "American Typewriter Medium", "American Typewriter", "Courier New", monospace;
      font-weight: 500;
      font-size: 15pt;
      line-height: 1;

      color: #b7b7b7;
      white-space: nowrap;
      text-decoration: none;
    }

    .nav-link {
      cursor: pointer;
      pointer-events: auto;
      transition: color 0.15s ease;
    }

    .nav-link:not(.current):hover {
      color: #fff800;
    }

    .project-name {
      grid-column: 1 / span 2;
      grid-row: 1;
      color: #5e5e5e;
    }

    .intro {
      grid-column: 7 / span 1;
      grid-row: 1;
      color: #b7b7b7;
    }

    .working-process {
      grid-column: 10 / span 2;
      grid-row: 1;
      color: #b7b7b7;
    }

    /* ==============================
       Background Information Text
       第四行第一列：网页名称
       第六行第一列：网页简要描述
       第六行第七列：网页网址
       ============================== */

    .site-name {
      grid-column: 1 / span 3;
      grid-row: 4;
      color: #5e5e5e;
    }

    .site-description {
      grid-column: 1 / span 5;
      grid-row: 6;
      align-self: end;
      color: #5e5e5e;
      font-size: 7.5pt;
      line-height: 1.15;
      white-space: normal;
      max-width: 100%;
    }

    .site-url {
      grid-column: 7 / span 5;
      grid-row: 6;
      align-self: end;
      color: #5e5e5e;
      font-size: 7.5pt;
      line-height: 1.15;
      white-space: normal;
      max-width: 100%;
    }

    /* ==============================
       Mobile Adaptation
       手机端直接使用同一套 12 列 6 行逻辑
       背景继续撑满屏幕
       文字稍微缩小，避免导航重叠
       ============================== */

    @media (max-width: 768px) {
      .page-grid {
        inset: 20px;
        width: calc(100vw - 40px);
        height: calc(100vh - 40px);
      }

      .nav-item,
      .background-info {
        font-size: 10pt;
      }

      .project-name {
        grid-column: 1 / span 3;
      }

      .intro {
        grid-column: 7 / span 1;
      }

      .working-process {
        grid-column: 10 / span 3;
      }

      .site-name {
        grid-column: 1 / span 4;
      }

      .site-description {
        grid-column: 1 / span 5;
        font-size: 5pt;
      }

      .site-url {
        grid-column: 7 / span 6;
        font-size: 5pt;
      }
    }

    @media (max-width: 420px) {
      .nav-item,
      .background-info {
        font-size: 8.5pt;
      }

      .site-description,
      .site-url {
        font-size: 4.25pt;
      }
    }
  </style>
</head>

<body>

  <main class="page-grid">

    <!-- ==============================
         第一行固定导航文字
         ============================== -->

    <div class="nav-item nav-link project-name current">The Unquiet Page</div>
    <div id="introLink" class="nav-item nav-link intro">Intro</div>
    <a class="nav-item nav-link working-process" href="https://antuyaran.github.io/workprocess/">Working Process</a>

    <!-- ==============================
         BACKGROUND INFO TEXT OUTPUT
         这些文本会根据随机背景图编号自动变化
         ============================== -->

    <div id="siteName" class="background-info site-name"></div>
    <div id="siteDescription" class="background-info site-description"></div>
    <div id="siteUrl" class="background-info site-url"></div>

  </main>

  <script>
    /* ==============================
       Navigation Links
       ============================== */

    const introPages = [
      "https://antuyaran.github.io/Intro1/",
      "https://antuyaran.github.io/Intro2/"
    ];

    const introLink = document.getElementById("introLink");

    introLink.addEventListener("click", () => {
      const randomIntroIndex = Math.floor(Math.random() * introPages.length);
      window.location.href = introPages[randomIntroIndex];
    });

    /* ==============================
       Random Background Settings
       现在使用 01.jpg - 18.jpg
       页面打开后立刻随机抽取一张，之后每 4 秒重新随机抽取一次
       ============================== */

    const totalBackgrounds = 18;
    const backgroundChangeInterval = 4000;

    const siteNameElement = document.getElementById("siteName");
    const siteDescriptionElement = document.getElementById("siteDescription");
    const siteUrlElement = document.getElementById("siteUrl");

    /* =========================================================
       EDIT AREA 1: Website name / description / URL text
       在这里修改不同编号范围对应的三个信息文本。

       start / end = 背景图编号范围
       name = 第四行第一列网页名称
       description = 最后一行第一列网页简要描述
       url = 最后一行第七列网页网址
       ========================================================= */

    const backgroundInfoGroups = [
      {
        start: 1,
        end: 5,
        name: "POLITICO",
        description: "Political news, newsletter, and policy reading page.",
        url: "https://www.politico.com/"
      },
      {
        start: 6,
        end: 10,
        name: "BBC News",
        description: "Public news platform with international reports and long-form articles.",
        url: "https://www.bbc.co.uk/news"
      },
      {
        start: 11,
        end: 15,
        name: "Daily Mail",
        description: "Popular news website with entertainment, current affairs and image-heavy reading pages.",
        url: "https://www.dailymail.co.uk/"
      },
      {
        start: 16,
        end: 18,
        name: "Nautilus",
        description: "Essay-based science and culture magazine with long-form reading pages.",
        url: "https://nautil.us/"
      }
    ];

    /* =========================================================
       EDIT AREA 2: Background image filename format
       当前格式为 01.jpg, 02.jpg ... 18.jpg。
       如果之后图片放进文件夹，例如 backgrounds/01.jpg，
       把 return 改成：return `backgrounds/${fileNumber}.jpg`;
       ========================================================= */

    function getBackgroundImagePath(number) {
      const fileNumber = String(number).padStart(2, "0");
      return `${fileNumber}.jpg`;
    }

    /* =========================================================
       EDIT AREA 3: Text fallback
       如果某个背景编号没有匹配到上面的范围，显示这里的文本。
       ========================================================= */

    const fallbackBackgroundInfo = {
      name: "Unknown Website",
      description: "Description text can be edited here.",
      url: "Website URL can be edited here."
    };

    function getBackgroundInfo(number) {
      return backgroundInfoGroups.find(group => {
        return number >= group.start && number <= group.end;
      }) || fallbackBackgroundInfo;
    }

    function updateBackgroundAndInfo() {
      const randomNumber = Math.floor(Math.random() * totalBackgrounds) + 1;
      const imagePath = getBackgroundImagePath(randomNumber);
      const info = getBackgroundInfo(randomNumber);

      document.body.style.backgroundImage = `url("${imagePath}")`;
      siteNameElement.textContent = info.name;
      siteDescriptionElement.textContent = info.description;
      siteUrlElement.textContent = info.url;
    }

    updateBackgroundAndInfo();
    setInterval(updateBackgroundAndInfo, backgroundChangeInterval);
  </script>

</body>
</html>
